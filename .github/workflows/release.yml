name: Release

# Pushing a version tag such as v0.1.0 runs the CI checks, packs every package, and creates a draft
# GitHub release with the tarballs and the version's section of CHANGELOG.md. Review the draft and
# publish it by hand; publishing it starts publish.yml, which sends the same tarballs to npm.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      # Fails before anything is built if a package's version doesn't match the tag, or if
      # CHANGELOG.md has no section for it
      - name: Write the release notes
        run: pnpm release:notes "$GITHUB_REF_NAME" > release-notes.md

      # Builds, then packs each package with LICENSE and NOTICE into release/
      - run: pnpm release:pack

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*.tgz
          --draft
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file release-notes.md
