name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  # release.yml runs these checks before it packs anything
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm (version from `packageManager` in package.json) and Node.js,
      # restores the pnpm store, then runs `pnpm install --frozen-lockfile`
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck

      - name: Install Chromium for the browser tests
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test --run
      - run: pnpm build

  # Screenshot tests. The committed reference screenshots come from this container and are only
  # valid here: the image fixes the OS, fonts, and Chromium. Its tag must match the Playwright
  # version in package.json, and screenshots.yml uses the same image to retake them.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      # Chromium needs more shared memory than Docker's default 64 MB
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - run: pnpm test:visual --run

      # The actual and diff images of failed comparisons
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: .vitest/attachments
          include-hidden-files: true
          if-no-files-found: ignore
