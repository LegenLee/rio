name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm (version from `packageManager` in package.json) and Node.js,
      # restores the pnpm store, then runs `pnpm install --frozen-lockfile`
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck

      - name: Install Chromium for the browser tests
        run: pnpm exec playwright install --with-deps chromium

      # `vrt` is left out until reference screenshots exist
      - run: pnpm test --run
      - run: pnpm build
