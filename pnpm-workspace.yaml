packages:
  - packages/*
  - playground

# All shared versions live here. Packages refer to them with "catalog:".
catalog:
  # tsdown is still 0.x, so pin the exact version
  tsdown: 0.23.7
  # TS 7.0 lacks the compiler API vue-tsc relies on. Stay on 6.x until 7.1 ships
  typescript: ~6.0.3
  vue: ^3.5.45
  # rolldown-plugin-dts accepts vue-tsc ~3.2 || ~3.3
  vue-tsc: ~3.3.14
  unplugin-vue: ^8.0.1
  vite: ^8.3.7
  '@vitejs/plugin-vue': ^6.0.10
